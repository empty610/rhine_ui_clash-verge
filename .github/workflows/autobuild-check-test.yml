name: Autobuild Check Logic Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/autobuild*.yml'
      - '.github/workflows/check-commit-needs-build.yml'
      - 'scripts-workflow/check-autobuild*.mjs'

permissions:
  contents: read

jobs:
  check_autobuild_logic:
    name: Check Autobuild Should Run Logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Check release completeness regressions
        run: node --test scripts-workflow/check-autobuild.test.mjs
